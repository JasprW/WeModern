plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

// Release signing material stays out of the repository. CI decodes it from repository
// secrets into a temporary file and points these variables at it; a local release build
// exports them directly. Without them the release build stays unsigned on purpose, so a
// release pipeline fails loudly instead of publishing a debug-signed APK.
def releaseKeystorePath = System.getenv("WEMODERN_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("WEMODERN_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("WEMODERN_KEY_ALIAS")
def releaseKeyPassword = System.getenv("WEMODERN_KEY_PASSWORD")
def hasReleaseSigningKey = releaseKeystorePath && releaseKeystorePassword
        && releaseKeyAlias && releaseKeyPassword

android {
    namespace "me.jaspr.wemodern"
    compileSdk 37

    defaultConfig {
        applicationId "me.jaspr.wemodern"
        minSdk 26
        targetSdk 37
        versionCode 35
        versionName "1.8.0"
    }

    signingConfigs {
        release {
            if (hasReleaseSigningKey) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigningKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        // NotificationDebugPreferences reads BuildConfig.DEBUG to pick per-build-type defaults.
        buildConfig true
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.04.01")
    implementation "androidx.activity:activity-compose:1.11.0"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3:1.5.0-alpha22"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:4.13.2"
}
