name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v1.9.0
        required: true
        type: string
      ref:
        description: Git ref to build (defaults to the branch this run was dispatched on)
        required: false
        type: string
      dry_run:
        description: Build, sign and verify without publishing a release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A manual run builds the ref it was dispatched on unless an explicit ref is given;
          # a tag push builds the tag. The release tag input only names the release.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set release tag
        id: release
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured. Refusing to publish an unsigned APK."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - name: Build signed release APK
        env:
          WEMODERN_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          WEMODERN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WEMODERN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WEMODERN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify the APK before publishing
        run: |
          BUILD_TOOLS="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/37.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::release APK was not produced"
            exit 1
          fi
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E "^package|^sdkVersion|^targetSdkVersion" || true
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::release APK is debuggable"
            exit 1
          fi

      - name: Rename APK and write checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "wemodern-${{ steps.release.outputs.tag }}.apk"
          sha256sum "wemodern-${{ steps.release.outputs.tag }}.apk" > SHA256SUMS
          cat SHA256SUMS

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Upload verified APK
        uses: actions/upload-artifact@v7
        with:
          name: wemodern-release-${{ steps.release.outputs.tag }}
          path: |
            wemodern-${{ steps.release.outputs.tag }}.apk
            SHA256SUMS

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: WeModern ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            wemodern-${{ steps.release.outputs.tag }}.apk
            SHA256SUMS
